name = "ringside-results-db"
main = "src/worker/index.ts"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "ringside"
database_id = "536687e6-c177-4049-838e-70f4d7d5ef55"
migrations_dir = "migrations"

# One tiny daily job (expires long-held matches). Uses 1 of the 5 free cron triggers.
[triggers]
crons = ["11 4 * * *"]
